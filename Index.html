<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Visual Tracking AR Cube</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}

#cam{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
}

#hud{
 position:fixed;
 inset:0;
 z-index:5;
 pointer-events:none;
}

#status{
 margin:16px;
 padding:13px;
 border-radius:18px;
 background:#000c;
 color:#fff;
 text-align:center;
 font-size:14px;
}

#info{
 position:fixed;
 left:16px;
 right:16px;
 bottom:96px;
 padding:10px;
 border-radius:14px;
 background:#000b;
 color:#ddd;
 text-align:center;
 font-size:12px;
}

#cube{
 position:fixed;
 left:50%;
 top:60%;
 width:86px;
 height:86px;
 transform-style:preserve-3d;
 display:none;
 z-index:3;
 pointer-events:none;
}

.face{
 position:absolute;
 width:86px;
 height:86px;
 border:2px solid white;
 background:#00bfff44;
}

.front{transform:translateZ(43px)}
.back{transform:rotateY(180deg) translateZ(43px)}
.right{transform:rotateY(90deg) translateZ(43px)}
.left{transform:rotateY(-90deg) translateZ(43px)}
.top{transform:rotateX(90deg) translateZ(43px)}
.bottom{transform:rotateX(-90deg) translateZ(43px)}

#reticle{
 position:fixed;
 left:50%;
 top:58%;
 width:34px;
 height:34px;
 transform:translate(-50%,-50%);
 border:2px solid #fff;
 border-radius:50%;
 z-index:2;
}

#buttons{
 position:fixed;
 bottom:15px;
 left:12px;
 right:12px;
 display:flex;
 gap:8px;
 z-index:10;
}

button{
 flex:1;
 border:0;
 border-radius:17px;
 padding:15px 5px;
 font-weight:bold;
 font-size:13px;
}

button:disabled{
 opacity:.35;
}
</style>
</head>

<body>

<video id="cam" autoplay playsinline muted></video>

<canvas id="work"></canvas>

<div id="hud">

 <div id="status">📷 Start camera</div>

 <div id="reticle"></div>

 <div id="cube">
  <div class="face front"></div>
  <div class="face back"></div>
  <div class="face right"></div>
  <div class="face left"></div>
  <div class="face top"></div>
  <div class="face bottom"></div>
 </div>

 <div id="info">
  AI visual tracking will analyze consecutive camera frames.
 </div>

</div>

<div id="buttons">

 <button id="start">
  📷 Start
 </button>

 <button id="place" disabled>
  🧊 Place cube
 </button>

 <button id="track" disabled>
  👁️ Track
 </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>

<script>

const video = document.getElementById("cam");

const canvas = document.getElementById("work");

const ctx = canvas.getContext(
 "2d",
 {willReadFrequently:true}
);

const statusEl =
 document.getElementById("status");

const info =
 document.getElementById("info");

const cube =
 document.getElementById("cube");

const startBtn =
 document.getElementById("start");

const placeBtn =
 document.getElementById("place");

const trackBtn =
 document.getElementById("track");


let stream = null;

let model = null;

let placed = false;

let tracking = false;

let aiBusy = false;

let prevFrame = null;

let anchorFrame = null;

let anchorX = 50;

let anchorY = 60;

let cubeX = 50;

let cubeY = 60;

let baseAlpha = null;

let baseBeta = 0;

let baseGamma = 0;

let frameCounter = 0;


function status(text){

 statusEl.textContent = text;

}


function clamp(value,min,max){

 return Math.max(
  min,
  Math.min(max,value)
 );

}


function angle(value){

 while(value > 180)
  value -= 360;

 while(value < -180)
  value += 360;

 return value;

}


/* =========================
   CAMERA
========================= */

async function startCamera(){

 status("📷 Requesting camera permission…");

 try{

  if(!window.isSecureContext){

   throw new Error(
    "HTTPS_REQUIRED"
   );

  }


  stream =
   await navigator.mediaDevices.getUserMedia({

    audio:false,

    video:{
     facingMode:{
      ideal:"environment"
     },

     width:{
      ideal:960
     },

     height:{
      ideal:540
     }
    }

   });


  video.srcObject = stream;

  await video.play();


  canvas.width = 320;

  canvas.height = 180;


  startBtn.disabled = true;

  placeBtn.disabled = false;


  status("✅ Camera ready");

  info.textContent =
   "Point at the floor/scene and press Place cube.";

 }catch(error){

  status(
   error.name === "NotAllowedError"
   ?
   "❌ Camera permission denied"
   :
   "❌ Camera error: " + error.message
  );

 }

}


/* =========================
   GYROSCOPE
========================= */

async function enableGyro(){

 try{

  if(
   typeof DeviceOrientationEvent ===
   "undefined"
  ){

   return;

  }


  if(
   typeof DeviceOrientationEvent.requestPermission ===
   "function"
  ){

   const permission =
    await DeviceOrientationEvent.requestPermission();

   if(permission !== "granted")
    return;

  }


  addEventListener(
   "deviceorientation",
   event => {

    if(baseAlpha === null){

     baseAlpha =
      event.alpha || 0;

     baseBeta =
      event.beta || 0;

     baseGamma =
      event.gamma || 0;

    }


    if(!placed)
     return;


    const yaw =
     angle(
      (event.alpha || 0) -
      baseAlpha
     );

    const pitch =
     (event.beta || 0) -
     baseBeta;

    const roll =
     (event.gamma || 0) -
     baseGamma;


    cube.style.transform =
     "translate(-50%,-50%) " +

     "rotateX(" +
     (-10 - pitch * 0.10) +
     "deg) " +

     "rotateY(" +
     (20 + yaw * 0.25) +
     "deg) " +

     "rotateZ(" +
     (-roll * 0.08) +
     "deg)";

   },
   true
  );

 }catch(error){

  console.warn(
   "Gyroscope unavailable",
   error
  );

 }

}


/* =========================
   CAMERA FRAME
========================= */

function getFrame(){

 ctx.drawImage(
  video,
  0,
  0,
  canvas.width,
  canvas.height
 );

 return ctx.getImageData(
  0,
  0,
  canvas.width,
  canvas.height
 );

}


/* =========================
   AI
========================= */

async function aiDescribe(frame){

 if(!model){

  await tf.ready();

  model =
   await mobilenet.load({
    version:2,
    alpha:1
   });

 }


 return await model.classify(
  canvas,
  5
 );

}


/* =========================
   VISUAL MOTION TRACKING
========================= */

function estimateMotion(
 oldImg,
 newImg
){

 const width =
  canvas.width;

 const height =
  canvas.height;

 const oldData =
  oldImg.data;

 const newData =
  newImg.data;


 const points = [];


 const centerX =
  anchorX / 100 * width;

 const centerY =
  anchorY / 100 * height;


 for(
  let y = -45;
  y <= 45;
  y += 22
 ){

  for(
   let x = -65;
   x <= 65;
   x += 22
  ){

   const px =
    Math.round(
     centerX + x
    );

   const py =
    Math.round(
     centerY + y
    );


   if(
    px > 10 &&
    px < width - 11 &&
    py > 10 &&
    py < height - 11
   ){

    points.push([
     px,
     py
    ]);

   }

  }

 }


 if(!points.length){

  return {
   dx:0,
   dy:0,
   quality:0
  };

 }


 function gray(
  data,
  x,
  y
 ){

  const index =
   (y * width + x) * 4;


  return (
   data[index] * 0.299 +
   data[index + 1] * 0.587 +
   data[index + 2] * 0.114
  );

 }


 function score(
  x1,
  y1,
  x2,
  y2
 ){

  const radius = 5;

  let sum = 0;

  let count = 0;


  for(
   let y = -radius;
   y <= radius;
   y += 2
  ){

   for(
    let x = -radius;
    x <= radius;
    x += 2
   ){

    const a =
     gray(
      oldData,
      x1 + x,
      y1 + y
     );

    const b =
     gray(
      newData,
      x2 + x,
      y2 + y
     );


    sum += Math.abs(
     a - b
    );

    count++;

   }

  }


  return sum / count;

 }


 const dxs = [];

 const dys = [];


 for(
  const [x,y] of points
 ){

  let best = 1e9;

  let bestX = 0;

  let bestY = 0;


  for(
   let dy = -18;
   dy <= 18;
   dy += 3
  ){

   for(
    let dx = -18;
    dx <= 18;
    dx += 3
   ){

    if(
     x + dx < 8 ||
     x + dx >= width - 8 ||
     y + dy < 8 ||
     y + dy >= height - 8
    )
     continue;


    const currentScore =
     score(
      x,
      y,
      x + dx,
      y + dy
     );


    if(
     currentScore < best
    ){

     best =
      currentScore;

     bestX = dx;

     bestY = dy;

    }

   }

  }


  if(best < 35){

   dxs.push(bestX);

   dys.push(bestY);

  }

 }


 if(dxs.length < 3){

  return {
   dx:0,
   dy:0,
   quality:0
  };

 }


 dxs.sort(
  (a,b)=>a-b
 );

 dys.sort(
  (a,b)=>a-b
 );


 const dx =
  dxs[
   Math.floor(
    dxs.length / 2
   )
  ];

 const dy =
  dys[
   Math.floor(
    dys.length / 2
   )
  ];


 return {
  dx,
  dy,
  quality:dxs.length
 };

}


/* =========================
   MOVE CUBE
========================= */

function setCube(
 x,
 y
){

 cubeX =
  clamp(
   x,
   7,
   93
  );

 cubeY =
  clamp(
   y,
   15,
   88
  );


 cube.style.left =
  cubeX + "%";

 cube.style.top =
  cubeY + "%";

}


/* =========================
   PLACE CUBE
========================= */

async function placeCube(){

 if(!stream)
  return;


 placed = true;

 tracking = true;


 cube.style.display =
  "block";


 setCube(
  50,
  60
 );


 anchorX = 50;

 anchorY = 60;


 prevFrame =
  getFrame();


 anchorFrame =
  prevFrame;


 await enableGyro();


 placeBtn.disabled =
  true;


 trackBtn.disabled =
  false;


 status(
  "🧊 Anchor saved — analyzing frames"
 );


 info.textContent =
  "The cube is anchored to visual features around this camera position.";


 requestAnimationFrame(
  trackLoop
 );

}


/* =========================
   CONTINUOUS TRACKING
========================= */

async function trackLoop(){

 if(
  !tracking ||
  !stream
 )
  return;


 const currentFrame =
  getFrame();


 const motion =
  estimateMotion(
   prevFrame,
   currentFrame
  );


 if(
  motion.quality >= 3
 ){

  const scale = 0.28;


  setCube(
   cubeX -
    motion.dx * scale,

   cubeY -
    motion.dy * scale
  );

 }


 prevFrame =
  currentFrame;


 frameCounter++;


 /*
  Run neural-network AI
  every 20 frames.
 */

 if(
  !aiBusy &&
  frameCounter % 20 === 0
 ){

  aiBusy = true;


  try{

   const predictions =
    await aiDescribe(
     currentFrame
    );


   const top =
    predictions
     .slice(0,3)
     .map(
      prediction =>
       prediction.className +
       " " +
       Math.round(
        prediction.probability * 100
       ) +
       "%"
     )
     .join(" • ");


   info.textContent =
    "🧠 AI frame analysis: " +
    top +
    " | visual points: " +
    motion.quality;


  }catch(error){

   console.warn(error);

  }


  aiBusy = false;

 }


 requestAnimationFrame(
  trackLoop
 );

}


/* =========================
   BUTTONS
========================= */

startBtn.onclick =
 startCamera;


placeBtn.onclick =
 placeCube;


trackBtn.onclick = () => {

 tracking =
  !tracking;


 trackBtn.textContent =
  tracking
  ?
  "⏸️ Pause"
  :
  "▶️ Track";


 if(tracking){

  prevFrame =
   getFrame();


  requestAnimationFrame(
   trackLoop
  );


  status(
   "👁️ Tracking camera frames"
  );

 }else{

  status(
   "⏸️ Tracking paused"
  );

 }

};

</script>

</body>
  </html>
