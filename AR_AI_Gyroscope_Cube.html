<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AI Gyro AR Cube</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial}#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#s{position:fixed;top:18px;left:18px;right:18px;padding:13px;border-radius:18px;background:#000b;color:white;text-align:center;z-index:3}#i{position:fixed;left:18px;right:18px;bottom:95px;padding:10px;border-radius:14px;background:#000a;color:#ddd;text-align:center;font-size:13px;z-index:3}#b{position:fixed;bottom:16px;left:12px;right:12px;display:flex;gap:8px;z-index:4}button{flex:1;padding:16px 6px;border:0;border-radius:17px;font-weight:bold}button:disabled{opacity:.35}#c{position:fixed;left:50%;top:65%;width:90px;height:90px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(-12deg) rotateY(20deg);display:none;z-index:2}.f{position:absolute;width:90px;height:90px;border:2px solid white;background:#00bfff55}.a{transform:translateZ(45px)}.d{transform:rotateY(180deg) translateZ(45px)}.r{transform:rotateY(90deg) translateZ(45px)}.l{transform:rotateY(-90deg) translateZ(45px)}.t{transform:rotateX(90deg) translateZ(45px)}.bo{transform:rotateX(-90deg) translateZ(45px)}#line{position:fixed;left:10%;right:10%;top:67%;height:2px;background:#0fa;opacity:0;z-index:2}
</style></head><body>
<video id="cam" autoplay playsinline muted></video><div id="s">📱 Tap Start AR</div><div id="line"></div>
<div id="c"><div class="f a"></div><div class="f d"></div><div class="f r"></div><div class="f l"></div><div class="f t"></div><div class="f bo"></div></div>
<div id="i">Real camera + gyroscope + browser AI scan</div><div id="b"><button id="start">📷 Start AR</button><button id="scan" disabled>🧠 AI Scan</button><button id="place" disabled>🧊 Place</button></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script>
const v=document.getElementById('cam'),s=document.getElementById('s'),i=document.getElementById('i'),c=document.getElementById('c'),line=document.getElementById('line'),st=document.getElementById('start'),sc=document.getElementById('scan'),pl=document.getElementById('place');
let stream,model,found=false,placed=false,ba=null,bb=0,bg=0;
const msg=x=>s.textContent=x;
async function gyro(){try{if(typeof DeviceOrientationEvent==='undefined')return false;if(DeviceOrientationEvent.requestPermission){if(await DeviceOrientationEvent.requestPermission()!=='granted')return false}addEventListener('deviceorientation',ori,true);return true}catch(e){return false}}
function ang(x){while(x>180)x-=360;while(x<-180)x+=360;return x}
function ori(e){if(!placed||ba===null)return;let yaw=ang((e.alpha||0)-ba),pit=(e.beta||0)-bb,roll=(e.gamma||0)-bg;c.style.left=Math.max(8,Math.min(92,50+yaw*.7+roll*.3))+'%';c.style.top=Math.max(18,Math.min(86,65+pit*.4))+'%';c.style.transform='translate(-50%,-50%) rotateX('+(-12-pit*.12)+'deg) rotateY('+(20+yaw*.35)+'deg)'}
async function start(){msg('📷 Requesting camera permission…');if(!isSecureContext)return msg('❌ Open this page using HTTPS.');try{try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})}catch(e){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true})}v.srcObject=stream;await v.play();st.disabled=true;sc.disabled=false;let g=await gyro();msg(g?'✅ Camera + gyroscope ready':'✅ Camera ready; gyroscope unavailable');i.textContent='Point at the floor and tap AI Scan.'}catch(e){msg(e.name==='NotAllowedError'?'❌ Camera permission denied. Allow Chrome camera access.':'❌ Camera error: '+e.name)}}
async function scan(){sc.disabled=true;try{msg('🧠 Loading AI…');await tf.ready();if(!model)model=await mobilenet.load({version:2,alpha:1});msg('🧠 AI scanning scene…');let p=await model.classify(v,6),txt=p.map(x=>x.className.toLowerCase()).join('|');found=true;line.style.opacity=1;pl.disabled=false;let likely=/floor|flooring|carpet|rug|tile|wood|room|desk|table|bench|patio|walkway/.test(txt);msg(likely?'✅ AI found a likely ground/room surface':'🟡 AI scanned the scene');i.textContent='AI: '+p.slice(0,3).map(x=>x.className+' '+Math.round(x.probability*100)+'%').join(' • ')}catch(e){console.error(e);msg('⚠️ AI failed to load/scan')}sc.disabled=false}
async function place(){if(!found)return msg('⚠️ AI Scan first');placed=true;c.style.display='block';let capture=e=>{if(ba===null){ba=e.alpha||0;bb=e.beta||0;bg=e.gamma||0;removeEventListener('deviceorientation',capture,true)}};addEventListener('deviceorientation',capture,true);msg('🧊 Cube placed — move your phone');i.textContent='Gyroscope is controlling the cube position/rotation.';if(navigator.xr){try{if(await navigator.xr.isSessionSupported('immersive-ar')){msg('🥽 Real AR supported — starting plane tracking…');let x=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test']});let ref=await x.requestReferenceSpace('local'),view=await x.requestReferenceSpace('viewer'),src=await x.requestHitTestSource({space:view});x.requestAnimationFrame(function f(t,fr){x.requestAnimationFrame(f);let h=fr.getHitTestResults(src);if(h.length){let pose=h[0].getPose(ref);if(pose){c.style.left='50%';c.style.top='58%'}}})}}catch(e){console.log('WebXR fallback',e)}}}
st.onclick=start;sc.onclick=scan;pl.onclick=place;
</script></body></html>
